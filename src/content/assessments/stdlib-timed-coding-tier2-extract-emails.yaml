title: 限时提取邮箱地址
description: 在限定时间内用 re 从文本中提取所有邮箱地址。
category: stdlib
kind: timed-coding
targetTier: tier2
concepts:
  - regular-expression
  - common-stdlib-modules
timeLimit: 480
prompt: |
  实现 extract_emails(text)，用正则返回文本中所有形如 name@domain.tld 的邮箱地址列表，保持出现顺序。没有则返回空列表。
starterCode: |
  import re

  def extract_emails(text):
      pass
testCases:
  - name: 提取多个邮箱并保序
    code: |
      text = "Contact ada.lovelace@example.com or guido@python.org."
      assert extract_emails(text) == ["ada.lovelace@example.com", "guido@python.org"]
  - name: 无邮箱返回空列表
    code: |
      assert extract_emails("no mail here") == []
referenceSolution: |
  import re

  def extract_emails(text):
      return re.findall(r"[\w.-]+@[\w.-]+\.\w+", text)
rubric:
  - 能用 re.findall 一次性提取所有匹配。
  - 正则能覆盖常见邮箱形态而不过度宽松。
  - 通过给定测试用例。
