title: 限时筛选正偶数
description: 在限定时间内用推导式按多条件过滤列表。
category: control-flow
kind: timed-coding
targetTier: tier2
concepts:
  - comprehension
  - if-statement
timeLimit: 360
prompt: |
  实现 filter_positive_evens(numbers)，返回输入列表中所有“大于 0 且为偶数”的元素，保持原顺序。
starterCode: |
  def filter_positive_evens(numbers):
      pass
testCases:
  - name: 混合输入只保留正偶数
    code: |
      assert filter_positive_evens([-2, 1, 4, 5, 6]) == [4, 6]
  - name: 无符合元素返回空列表
    code: |
      assert filter_positive_evens([1, 3, -4]) == []
referenceSolution: |
  def filter_positive_evens(numbers):
      return [n for n in numbers if n > 0 and n % 2 == 0]
rubric:
  - 能用推导式表达带多条件的过滤。
  - 能正确组合“正数”与“偶数”两个条件。
  - 通过给定测试用例。
